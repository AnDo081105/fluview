name: Refresh CDC surveillance data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 6"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Refresh source snapshots and marts
        run: python -m fluview.pipeline

      - name: Validate generated data
        run: |
          pytest
          ruff check .

      - name: Report degraded source refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > refresh-health.txt
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/manifest.json").read_text())
          for name, status in manifest["sources"].items():
              if not status["ok"]:
                  print(f"{name}: {status['message']}")
          PY
          if [ -s refresh-health.txt ]; then
            cat refresh-health.txt >> "$GITHUB_STEP_SUMMARY"
            existing="$(gh issue list --state open --search 'Data refresh degraded in:title' --json number --jq '.[0].number // empty')"
            if [ -z "$existing" ]; then
              gh issue create \
                --title "Data refresh degraded" \
                --body-file refresh-health.txt \
                --label bug
            else
              gh issue comment "$existing" --body-file refresh-health.txt
            fi
          else
            echo "All sources refreshed successfully." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open reviewable data refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/weekly-data-refresh
          delete-branch: true
          commit-message: "data: refresh CDC surveillance snapshots"
          title: "data: weekly CDC surveillance refresh"
          body: |
            Automated weekly refresh of CDC ILINet and FluSurv-NET data.

            - Review `data/manifest.json` for source-specific status and as-of dates.
            - Tests and schema contracts passed before this PR was opened.
            - Merging updates the data consumed by the Render deployment.
          labels: documentation
