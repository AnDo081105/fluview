[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluview-pulse"
version = "0.1.0"
description = "A reproducible US influenza surveillance dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dash>=3.0",
  "duckdb>=1.3",
  "gunicorn>=23.0",
  "jupyter>=1.1",
  "nbformat>=5.10",
  "pandas>=2.2",
  "plotly>=6.0",
  "pyarrow>=19.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
fluview-refresh = "fluview.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fluview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
